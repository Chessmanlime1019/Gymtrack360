<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- Pantalla completa en móvil, respetando el notch -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <!-- GYMTRACK 360 -->
    <title>GYMTRACK 360</title>
    <meta
      name="description"
      content="Gestión y acceso digital para Cascada Gym."
    />

    <!-- Tema claro u oscuro: se aplica antes de cargar la app para que no
         parpadee (misma clave y regla que src/context/TemaContext.tsx) -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0B0F13" />
    <script>
      (function () {
        var t = "system";
        try { t = localStorage.getItem("gt-tema") || "system"; } catch (e) {}
        var oscuro = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        var raiz = document.documentElement;
        if (oscuro) raiz.classList.add("dark");
        raiz.style.colorScheme = oscuro ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]').setAttribute("content", oscuro ? "#0B0F13" : "#FFFFFF");
      })();
    </script>

    <!-- Iconos (el manifest lo agrega solo vite-plugin-pwa) -->
    <link rel="icon" href="/icons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- iPhone y otros móviles -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GYMTRACK" />
    <!-- "black": la barra de estado del iPhone ya no tapa la TopBar -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>

  <body class="bg-background text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
